[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-formatter"
version = "0.1.0"
description = "Command-line JSON formatter and validator with predictable, pipe-safe output."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.17.4"]

[project.scripts]
jsonfmt = "json_formatter.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/json-formatter"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned groups so a newer Ruff default cannot change CI on its own.
select = ["E", "F", "I", "W", "UP", "B", "PIE", "C4", "SIM", "RUF"]
