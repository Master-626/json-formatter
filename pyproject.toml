[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-formatter"
version = "0.1.0"
description = "A JSON formatting and validation CLI tool."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
jsonfmt = "json_formatter.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/json-formatter"

[tool.pytest.ini_options]
testpaths = ["tests"]
